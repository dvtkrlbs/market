openapi: 3.0.3
info:
  title: Market entries API
  version: 0.1.0
paths:
  /entries:
    get:
      operationId: listEntries
      responses:
        "200":
          description: Entries, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Entry"
    post:
      operationId: createEntry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEntry"
      responses:
        "201":
          description: Entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "../common/openapi.yaml#/components/schemas/Error"
components:
  schemas:
    Entry:
      type: object
      required: [id, description, amountCents, occurredAt, createdAt]
      properties:
        id:
          type: integer
          x-go-name: ID
        description:
          type: string
        amountCents:
          type: integer
          format: int64
        occurredAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    CreateEntry:
      type: object
      required: [description, amountCents, occurredAt]
      properties:
        description:
          type: string
          minLength: 1
        amountCents:
          type: integer
          format: int64
        occurredAt:
          type: string
          format: date-time
