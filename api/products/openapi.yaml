openapi: 3.0.3
info:
  title: Market products API
  version: 0.1.0
paths:
  /users/{userId}/stores/{storeId}/products:
    parameters:
      - $ref: '../common/openapi.yaml#/components/parameters/UserId'
      - $ref: '../common/openapi.yaml#/components/parameters/StoreId'
    get:
      operationId: listProducts
      security:
        - SessionAuth: []
      parameters:
        - $ref: '../common/openapi.yaml#/components/parameters/ContextParam'
      responses:
        '200':
          description: Products of store
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../common/openapi.yaml#/components/schemas/Product'

components:
  securitySchemes:
    SessionAuth:
      $ref: "../common/openapi.yaml#/components/securitySchemes/SessionAuth"
