components:
  securitySchemes:
    SessionAuth:
      type: apiKey
      in: cookie
      name: session
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      description: Must match the authenticated user.
      schema:
        type: integer
        minimum: 1
    StoreId:
      name: storeId
      in: path
      required: true
      description: Must match an existing store.
      schema:
        type: integer
        minimum: 1
    ContextParam:
      name: context
      in: query
      description: Shop lists approved global stores; manage lists stores administered by this user, including unapproved stores. Both exclude deleted stores. Admin lists stores administered by this user, including unapproved and deleted stores.
      schema:
        type: string
        enum: [admin, manage, shop]
        default: shop

  schemas:
    Store:
      type: object
      required: [id, name, approved]
      properties:
        id:
          type: integer
          x-go-name: ID
        name:
          type: string
        approved:
          type: boolean
    Product:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          x-go-name: ID
        barcode:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time


    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
