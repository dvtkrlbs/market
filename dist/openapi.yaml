components:
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Invalid request
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Authentication failed
  schemas:
    CreateEntry:
      properties:
        amountCents:
          format: int64
          type: integer
        description:
          minLength: 1
          type: string
        occurredAt:
          format: date-time
          type: string
      required:
      - description
      - amountCents
      - occurredAt
      type: object
    Credentials:
      properties:
        email:
          format: email
          maxLength: 320
          type: string
        password:
          maxLength: 128
          minLength: 8
          type: string
      required:
      - email
      - password
      type: object
    Entry:
      properties:
        amountCents:
          format: int64
          type: integer
        createdAt:
          format: date-time
          type: string
        description:
          type: string
        id:
          type: integer
          x-go-name: ID
        occurredAt:
          format: date-time
          type: string
      required:
      - id
      - description
      - amountCents
      - occurredAt
      - createdAt
      type: object
    Error:
      properties:
        message:
          type: string
      required:
      - message
      type: object
    Health:
      properties:
        status:
          type: string
      required:
      - status
      type: object
    OrdersPlaceholder:
      properties:
        status:
          type: string
      required:
      - status
      type: object
    SessionExpiry:
      properties:
        expiresAt:
          format: date-time
          type: string
      required:
      - expiresAt
      type: object
    User:
      properties:
        createdAt:
          format: date-time
          type: string
        email:
          format: email
          type: string
        id:
          format: int64
          type: integer
          x-go-name: ID
      required:
      - id
      - email
      - createdAt
      type: object
    Whoami:
      properties:
        sessionExpiresAt:
          format: date-time
          type: string
        user:
          $ref: "#/components/schemas/User"
      required:
      - user
      - sessionExpiresAt
      type: object
  securitySchemes:
    SessionAuth:
      in: cookie
      name: session
      type: apiKey
info:
  title: Market API
  version: 0.1.0
openapi: 3.0.3
paths:
  /auth/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionExpiry"
          description: Login succeeded; sets the HttpOnly session cookie
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout:
    post:
      operationId: logout
      responses:
        "204":
          description: Session revoked; clears the session cookie
        "401":
          $ref: "#/components/responses/Unauthorized"
      security:
      - SessionAuth: []
  /auth/refresh:
    post:
      operationId: refresh
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionExpiry"
          description: Session expiry extended; updates the session cookie
        "401":
          $ref: "#/components/responses/Unauthorized"
      security:
      - SessionAuth: []
  /auth/register:
    post:
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: User registered
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Email is already registered
  /auth/whoami:
    get:
      operationId: whoami
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Whoami"
          description: Current user and session
        "401":
          $ref: "#/components/responses/Unauthorized"
      security:
      - SessionAuth: []
  /entries:
    get:
      operationId: listEntries
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Entry"
                type: array
          description: Entries, newest first
      security:
      - SessionAuth: []
    post:
      operationId: createEntry
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEntry"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
          description: Entry created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Invalid request
      security:
      - SessionAuth: []
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
          description: Service is healthy
  /orders:
    get:
      operationId: getOrdersPlaceholder
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrdersPlaceholder"
          description: Placeholder response for the future orders API
      security:
      - SessionAuth: []
