components:
  parameters:
    ContextParam:
      description: Shop lists approved global stores; manage lists stores administered by this user, including unapproved stores. Both exclude deleted stores. Admin lists stores administered by this user, including unapproved and deleted stores.
      in: query
      name: context
      schema:
        default: shop
        enum:
        - admin
        - manage
        - shop
        type: string
    StoreId:
      description: Must match an existing store.
      in: path
      name: storeId
      required: true
      schema:
        minimum: 1.0
        type: integer
    StoreUserId:
      description: Must match the authenticated user.
      in: path
      name: userId
      required: true
      schema:
        minimum: 1.0
        type: integer
    UserId:
      description: Must match the authenticated user.
      in: path
      name: userId
      required: true
      schema:
        minimum: 1.0
        type: integer
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Invalid request
    StoreBadRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Invalid request
    StoreForbidden:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: User mismatch, store administration or global admin membership required
    StoreNotFound:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Store not found or not visible to this user
    StoreUnauthorized:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Authentication required
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Authentication failed
  schemas:
    CreateStore:
      additionalProperties: false
      properties:
        name:
          minLength: 1
          type: string
      required:
      - name
      type: object
    Credentials:
      properties:
        email:
          format: email
          maxLength: 320
          type: string
        password:
          maxLength: 128
          minLength: 8
          type: string
      required:
      - email
      - password
      type: object
    Error:
      properties:
        message:
          type: string
      required:
      - message
      type: object
    Health:
      properties:
        status:
          type: string
      required:
      - status
      type: object
    Product:
      properties:
        barcode:
          type: string
        created_at:
          format: date-time
          type: string
        deleted_at:
          format: date-time
          type: string
        id:
          type: integer
          x-go-name: ID
        name:
          type: string
      required:
      - id
      - name
      type: object
    SessionExpiry:
      properties:
        expiresAt:
          format: date-time
          type: string
      required:
      - expiresAt
      type: object
    Store:
      properties:
        approved:
          type: boolean
        id:
          type: integer
          x-go-name: ID
        name:
          type: string
      required:
      - id
      - name
      - approved
      type: object
    UpdateStore:
      additionalProperties: false
      minProperties: 1
      properties:
        approved:
          type: boolean
        name:
          minLength: 1
          type: string
      type: object
    User:
      properties:
        createdAt:
          format: date-time
          type: string
        email:
          format: email
          type: string
        id:
          format: int64
          type: integer
          x-go-name: ID
      required:
      - id
      - email
      - createdAt
      type: object
    Whoami:
      properties:
        sessionExpiresAt:
          format: date-time
          type: string
        user:
          $ref: "#/components/schemas/User"
      required:
      - user
      - sessionExpiresAt
      type: object
  securitySchemes:
    SessionAuth:
      in: cookie
      name: session
      type: apiKey
info:
  title: Market API
  version: 0.1.0
openapi: 3.0.3
paths:
  /auth/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionExpiry"
          description: Login succeeded; sets the HttpOnly session cookie
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout:
    post:
      operationId: logout
      responses:
        "204":
          description: Session revoked; clears the session cookie
        "401":
          $ref: "#/components/responses/Unauthorized"
      security:
      - SessionAuth: []
  /auth/refresh:
    post:
      operationId: refresh
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionExpiry"
          description: Session expiry extended; updates the session cookie
        "401":
          $ref: "#/components/responses/Unauthorized"
      security:
      - SessionAuth: []
  /auth/register:
    post:
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: User registered
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Email is already registered
  /auth/whoami:
    get:
      operationId: whoami
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Whoami"
          description: Current user and session
        "401":
          $ref: "#/components/responses/Unauthorized"
      security:
      - SessionAuth: []
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
          description: Service is healthy
  /stores/{storeId}/approve:
    parameters:
    - in: path
      name: storeId
      required: true
      schema:
        minimum: 1.0
        type: integer
    post:
      description: Approves a non-deleted store. Requires the authenticated user to be listed in the global admins table. Repeated approval is idempotent.
      operationId: approveStore
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
          description: Store approved
        "401":
          $ref: "#/components/responses/StoreUnauthorized"
        "403":
          $ref: "#/components/responses/StoreForbidden"
        "404":
          $ref: "#/components/responses/StoreNotFound"
      security:
      - SessionAuth: []
  /users/{userId}/stores:
    get:
      operationId: listStores
      parameters:
      - $ref: "#/components/parameters/ContextParam"
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Store"
                type: array
          description: Stores ordered by ID
        "401":
          $ref: "#/components/responses/StoreUnauthorized"
        "403":
          $ref: "#/components/responses/StoreForbidden"
      security:
      - SessionAuth: []
    parameters:
    - $ref: "#/components/parameters/UserId"
    post:
      description: Creates an unapproved global store and makes the requesting user its StoreAdmin.
      operationId: createStore
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStore"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
          description: Store created
        "400":
          $ref: "#/components/responses/StoreBadRequest"
        "401":
          $ref: "#/components/responses/StoreUnauthorized"
        "403":
          $ref: "#/components/responses/StoreForbidden"
      security:
      - SessionAuth: []
  /users/{userId}/stores/{storeId}:
    delete:
      description: Soft-deletes a store administered by the requesting user, retaining its StoreAdmin memberships.
      operationId: deleteStore
      responses:
        "204":
          description: Store deleted
        "401":
          $ref: "#/components/responses/StoreUnauthorized"
        "403":
          $ref: "#/components/responses/StoreForbidden"
        "404":
          $ref: "#/components/responses/StoreNotFound"
      security:
      - SessionAuth: []
    get:
      description: Returns an approved store, or an unapproved store if the user administers it.
      operationId: getStore
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
          description: Store
        "401":
          $ref: "#/components/responses/StoreUnauthorized"
        "403":
          $ref: "#/components/responses/StoreForbidden"
        "404":
          $ref: "#/components/responses/StoreNotFound"
      security:
      - SessionAuth: []
    parameters:
    - $ref: "#/components/parameters/StoreUserId"
    - in: path
      name: storeId
      required: true
      schema:
        minimum: 1.0
        type: integer
    patch:
      description: Updates a store administered by the requesting user. Changing approval also requires global admin membership.
      operationId: updateStore
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStore"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
          description: Store updated
        "400":
          $ref: "#/components/responses/StoreBadRequest"
        "401":
          $ref: "#/components/responses/StoreUnauthorized"
        "403":
          $ref: "#/components/responses/StoreForbidden"
        "404":
          $ref: "#/components/responses/StoreNotFound"
      security:
      - SessionAuth: []
  /users/{userId}/stores/{storeId}/products:
    get:
      operationId: listProducts
      parameters:
      - $ref: "#/components/parameters/ContextParam"
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Product"
                type: array
          description: Products of store
      security:
      - SessionAuth: []
    parameters:
    - $ref: "#/components/parameters/UserId"
    - $ref: "#/components/parameters/StoreId"
