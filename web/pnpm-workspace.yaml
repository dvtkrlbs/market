packages:
  - apps/*
  - packages/*

catalogMode: prefer

allowBuilds:
  "@astryxdesign/core": false # Its postinstall only prints a CLI setup reminder.
  esbuild: true

catalog:
  "@astryxdesign/build": 0.6.7
  "@astryxdesign/core": 0.6.7
  "@astryxdesign/theme-neutral": 0.6.7
  "@babel/core": ^7.29.0
  "@stylexjs/babel-plugin": ^0.19.1
  "@stylexjs/stylex": ^0.19.1
  "@stylexjs/unplugin": ^0.19.1
  "@tanstack/react-form": ^1.33.5
  "@tanstack/react-query": ^5.104.1
  "@tanstack/react-router": ^1.170.42
  "@tanstack/react-table": ^9.2.8
  "@tanstack/router-plugin": ^1.168.43
  "@testing-library/react": ^16.3.3
  "@types/node": ^24
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^5.2.0
  jsdom: ^30.1.2
  orval: 8.41.0
  react: ^19.3.0
  react-dom: ^19.3.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0

overrides:
  vite@*: "catalog:"
  vitest@*: 5.0.3

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

minimumReleaseAgeExclude:
  - "@tanstack/history@1.162.5"
  - "@tanstack/react-router@1.170.42"
  - "@tanstack/router-core@1.171.35"
  - "@tanstack/router-generator@1.167.41"
  - "@tanstack/router-plugin@1.168.43"
