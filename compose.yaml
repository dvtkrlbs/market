services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: market
      POSTGRES_USER: market
      POSTGRES_PASSWORD: market
    ports:
      - "5432:5432"
    volumes:
      - market-postgres-18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market -d market"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  market-postgres-18:
